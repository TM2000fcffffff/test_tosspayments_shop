<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문/결제 | LAYERED</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- 토스페이먼츠 결제위젯 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body data-category="">
  <div id="site-header"></div>

  <main class="checkout" id="checkout">
    <h1>주문/결제</h1>

    <div id="checkout-main">
      <section class="section">
        <h2>주문 상품 <small id="item-count"></small></h2>
        <div id="cart-list"></div>
      </section>

      <section class="section">
        <h2>주문자 / 배송 정보</h2>
        <form class="form-grid" id="order-form" novalidate>
          <div class="field">
            <label for="name">이름</label>
            <input id="name" name="name" autocomplete="name" placeholder="홍길동" required>
          </div>
          <div class="field">
            <label for="phone">휴대폰 번호</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678" required>
          </div>
          <div class="field full">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required>
          </div>
          <div class="field full">
            <label for="address">배송지 주소</label>
            <input id="address" name="address" autocomplete="street-address" placeholder="서울특별시 강남구 테헤란로 123" required>
          </div>
        </form>
      </section>

      <section class="section">
        <h2>결제 수단</h2>
        <div class="widget-box" id="payment-method"></div>
        <div id="agreement"></div>
      </section>
    </div>

    <aside class="summary" id="summary">
      <h2>결제 금액</h2>
      <div class="sum-row"><span>상품 금액</span><span id="sum-origin">0원</span></div>
      <div class="sum-row discount"><span>할인 금액</span><span id="sum-discount">0원</span></div>
      <div class="sum-row"><span>배송비</span><span id="sum-ship">0원</span></div>
      <div class="sum-total"><span>총 결제 금액</span><strong id="sum-total">0원</strong></div>
      <p class="note" id="ship-note"></p>
      <button type="button" class="btn btn-primary" id="pay-btn" disabled>결제수단 불러오는 중…</button>
      <p class="test-badge">테스트 환경입니다. 결제를 진행해도 실제로 청구되지 않습니다.</p>
    </aside>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>

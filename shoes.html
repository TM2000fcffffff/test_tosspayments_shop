<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신발 | LAYERED</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="shoes">
  <div id="site-header"></div>

  <main>
    <section class="promo">
      <div>
        <strong>스니커즈 위크</strong>
        <span>데일리 스니커즈부터 러닝화, 부츠까지</span>
      </div>
      <em>~35%</em>
    </section>

    <div class="page-head">
      <h1 id="title">신발 랭킹</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <select class="sort" id="sort" aria-label="정렬">
        <option value="rec">추천순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
        <option value="discount">할인율순</option>
        <option value="review">후기순</option>
      </select>
    </div>
    <section class="grid" id="grid"></section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>

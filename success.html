<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 완료 | LAYERED</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="">
  <div id="site-header"></div>

  <main class="result" id="result">
    <div class="icon">✓</div>
    <h1>결제가 완료되었습니다</h1>
    <p>주문해주셔서 감사합니다.<br>주문 내역은 입력하신 이메일로도 안내됩니다.</p>

    <dl class="receipt" id="receipt"></dl>
    <div id="notes"></div>

    <div class="btn-row">
      <a class="btn" href="index.html">쇼핑 계속하기</a>
      <a class="btn btn-primary" href="index.html">주문 내역</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const paymentKey = params.get('paymentKey');
      const orderId = params.get('orderId');
      const amount = Number(params.get('amount'));
      let pending = null;
      try { pending = JSON.parse(sessionStorage.getItem('layered_pending_order')); } catch (e) {}

      const rows = [
        ['주문번호', orderId || '-'],
        ['주문상품', pending ? pending.orderName : '-'],
        ['배송지', pending ? pending.address : '-'],
        ['결제금액', amount ? won(amount) : '-'],
        ['paymentKey', paymentKey || '-'],
      ];
      document.getElementById('receipt').innerHTML = rows
        .map(([k, v]) => `<div><dt>${k}</dt><dd>${escapeHTML(v)}</dd></div>`)
        .join('');

      const notes = document.getElementById('notes');
      // 결제 요청 때 저장한 금액과 리다이렉트로 받은 금액이 같은지 확인 (금액 위변조 방지)
      const matched = pending && pending.orderId === orderId && pending.amount === amount;
      if (!paymentKey || !matched) {
        notes.innerHTML = '<div class="dev-note warn">주문 정보가 일치하지 않습니다. 결제 승인을 진행하지 마세요.</div>';
        return;
      }

      // 결제가 정상 인증되었으므로 장바구니 비우기
      Cart.clear();
      try { sessionStorage.removeItem('layered_pending_order'); } catch (e) {}

      notes.innerHTML = `
        <div class="dev-note">
          <b>개발 안내</b> · 현재는 결제 <b>인증</b>까지 완료된 상태입니다. 서버에서 아래 결제 승인 API를 10분 안에 호출해야 결제가 최종 완료됩니다.
          시크릿 키는 노출되면 안 되므로 반드시 서버에서 호출하세요.
          <pre>POST https://api.tosspayments.com/v1/payments/confirm
Authorization: Basic base64("{시크릿 키}:")
Content-Type: application/json

${escapeHTML(JSON.stringify({ paymentKey, orderId, amount }, null, 2))}</pre>
        </div>`;
    })();
  </script>
</body>
</html>
